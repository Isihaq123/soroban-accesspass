name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Format check ──────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Clippy lint ───────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Lint against the native host target (tests + lib) and the wasm target (lib only)
      - run: cargo clippy --target x86_64-unknown-linux-gnu --all-targets -- -D warnings

  # ── Unit tests ────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Run on the native Linux host — soroban testutils requires std.
      # Note: soroban-env-host has a known Windows-only compile issue with
      # ed25519-dalek/rand_core on recent Rust stable; this does not affect Linux.
      - run: cargo test --target x86_64-unknown-linux-gnu

  # ── Wasm contract build ───────────────────────────────────────────────────
  build:
    name: Contract Build (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Build contract
        run: stellar contract build

      - name: Upload wasm artefact
        uses: actions/upload-artifact@v4
        with:
          name: soroban-accesspass-wasm
          path: target/wasm32-unknown-unknown/release/soroban_accesspass.wasm
          if-no-files-found: error
