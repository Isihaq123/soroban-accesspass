[workspace]
resolver = "2"

members = [
    "contracts/accesspass",
]

[workspace.dependencies]
# soroban-sdk 20.5.0 is the last stable release series without the
# ed25519-dalek 3.0.0 / rand_core API incompatibility in soroban-env-host.
soroban-sdk = { version = "=20.5.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
